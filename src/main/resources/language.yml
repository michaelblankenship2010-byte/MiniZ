      name: "Hunt hostile mobs"
      lore: "Zombies, skeletons, creepers, spiders...\n(when the job is Hunter)"
    hunt-passive:
      name: "Hunt passive mobs"
      lore: "Cows, pigs, sheep, chickens...\nNever pets, named or leashed mobs,\nor babies"
    replant:
      name: "Replant crops"
      lore: "Plants seeds back after harvesting"
    collect:
      name: "Loot into backpack"
      lore: "Harvests, mob drops and nearby\ndropped items go into its backpack"
