  reset:
    done: "Mini Me reset to defaults."
  unknown: "Unknown option. /miniz help for the list."

# /miniz help. {command} and {description} are filled in by help.format.
help:
  header: "<gold>Customize your Mini Me:"
  format: "<yellow>{command}</yellow> <gray>— {description}"
  menu: "bring it out + open the menu"
  on-off: "bring out / put away"
  name: "colors work: <gradient:aqua:light_purple>Tiny</gradient>"
  nametag: "show or hide its name"
  mode: "how it moves"
  pose: "resting pose"
  trail: "particle trail"
  glow: "glowing outline"
  mimic: "copy your moves + held items"
  outfit: "wear your armor"
  hand: "main hand"
  emotes: "pick from {count} emotes"
  emote: "e.g. dance, moonwalk, faint, magic"
  job: "give it work to do"
  hunt: "which mobs it fights"
  replant: "plant seeds back after harvesting"
  collect: "loot into its backpack"
  backpack: "open its inventory"
  gear: "give it armor and a weapon/tool"
  upgrades: "spend dragon eggs to upgrade its health"
  festive: "holiday looks (Santa hat at Christmas...)"
  mine: "choose what the Miner digs up"
  mine-this: "dig to the ore you're looking at (or sneak + punch the air)"
  aggro: "let mobs attack it (it fights back)"
  summon: "pop it back next to you"
  reset: "everything back to default"

# Things your Mini Me says in chat. {name} = its name, {message} = what it says.
speech:
  holiday-greeting: "{greeting}, {player}!"
  holiday-gift: "I got you a {holiday} present! Check your inventory."
  knocked-out: "Ouch! I got knocked out... back in {seconds} seconds."
  format: "{name} <dark_gray>»</dark_gray> <white>{message}"
  open-backpack-button: " <click:run_command:'/miniz backpack'><yellow>[open my backpack]</yellow></click>"
  back: "I'm back!"
  stronger: "I feel stronger! Max health is now {health}."
  order:
    start: "On it! Digging to that {thing}."
    gone: "Someone already mined that one!"
    you-left: "You went too far away, so I came back."
    gave-up: "I couldn't get to it, sorry."
    need-better-tool: "I need a better pickaxe for that. Put one in my Gear!"
    protected: "I'm not allowed to dig there."
    done: "Got it!"
    done-vein: "Got it! I mined the whole vein ({count} blocks)."
    blocked: "I can't dig through that."
    lava: "There's lava in the way. I'm not going in there!"
    too-long: "That's a really long way to dig. Bring me closer!"
  back-to-work: "Thanks! Back to work."
  full-other-world: "I'm full! Come get your stuff, or empty my backpack."
  full-delivered: "I'm full! Here's what I found ({count} items)."
  full-you-too: "I'm full! Your inventory's full too, so I kept the rest."
  full-waiting: "I'm full! Empty my backpack and I'll get back to work."

# The health line under its name (while mobs can attack it).
