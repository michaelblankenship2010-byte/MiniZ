# ------------------------------------------------------------
#  MiniZ - language.yml
# ------------------------------------------------------------
# Every bit of text players see. Change anything you like, then run /miniz reload.
#
#  * Colors and styles use MiniMessage: <red>, <gold>, <bold>, <gradient:aqua:light_purple>...</gradient>,
#    <rainbow>...</rainbow>, even <click:run_command:'/miniz'>...</click>.
#    Guide: https://docs.advntr.dev/minimessage/format.html
#  * {words} in curly brackets are filled in by the plugin (a player's name, a number...). Keep them.
#  * \n starts a new line (used in menu item descriptions).
#  * To show a < character as text, write \\< (e.g. /miniz name \\<name>).
#  * Missing lines fall back to English and are added back to this file automatically.

# The tag in front of every chat line from MiniZ.
prefix: "<dark_gray>[<gold>MiniZ</gold>]</dark_gray> "

# Little words used in many places.
word:
  "on": "<green>ON"
  "off": "<red>OFF"

# Replies to /miniz commands.
cmd:
  no-permission: "You can't do that."
  reloaded: "Config and language.yml reloaded."
  clear:
    usage: "Usage: /miniz clear \\<player>"
    done: "Put away {player}'s Mini Me."
  player-offline: "That player isn't online."
  players-only: "Only players have a Mini Me."
  "on":
    already: "Your Mini Me is already out."
    knocked-out: "Your Mini Me is knocked out. It'll be back in {seconds}s."
    done: "Here's your Mini Me!"
  "off":
    done: "Mini Me put away. /miniz on to bring it back."
  name:
    usage: "Usage: /miniz name \\<name>  (or reset)"
    too-long: "That name is too long (max {max} characters)."
    bad-tags: "Those color tags don't look right."
    empty: "The name can't be empty."
    too-many-letters: "Keep the name to 32 letters or fewer."
    done: "Name set to {name}"
  nametag:
    usage: "Usage: /miniz nametag on|off"
    shown: "Name tag shown."
    hidden: "Name tag hidden."
  mode:
    usage: "Usage: /miniz mode follow|stay|orbit|shoulder"
    done: "Mode: {mode} — {description}."
  pose:
    usage: "Usage: /miniz pose stand|sneak|sleep|swim|glide"
    done: "Resting pose: {pose}."
  trail:
    usage: "Usage: /miniz trail {options}"
    done: "Trail: {trail}."
  glow:
    usage: "Usage: /miniz glow \\<color>|off"
    unknown: "Unknown color. Try: red, gold, aqua, light_purple..."
    "off": "Glow off."
    done: "Glowing {color}."
  mimic:
    usage: "Usage: /miniz mimic on|off"
    "on": "It'll copy what you do."
    "off": "It'll stop copying you."
  outfit:
    usage: "Usage: /miniz outfit on|off"
    "on": "It'll wear whatever armor you wear."
    "off": "Armor off."
  hand:
    usage: "Usage: /miniz hand left|right"
    left: "Main hand: left."
    right: "Main hand: right."
  emote:
    unknown: "Unknown emote. Try: {options}|random|stop"
  not-out: "Bring your Mini Me out first (/miniz on)."
  job:
    usage: "Usage: /miniz job farm|hunt|both|mine|off"
    "off": "Job off. It'll just hang out with you."
    done: "Job: {job} — {description}."
    switched-to-follow: "Switched to Follow mode so it can work."
    hunt-tip: "Tip: turn on /miniz hunt hostile on (or passive) so it has something to fight."
  hunt:
    usage: "Usage: /miniz hunt hostile|passive on|off"
    hostile-on: "Hostile mobs: will be hunted."
    hostile-off: "Hostile mobs: left alone."
    passive-on: "Passive mobs: will be hunted."
    passive-off: "Passive mobs: left alone."
    not-hunter: "(Set /miniz job hunt to start hunting.)"
  replant:
    usage: "Usage: /miniz replant on|off"
    "on": "It'll replant crops after harvesting."
    "off": "It won't replant."
  collect:
    usage: "Usage: /miniz collect on|off"
    "on": "Loot goes into its backpack."
    "off": "Loot stays on the ground."
  festive:
    test-off: "Holiday preview off — back to the real date."
    test-unknown: "Holidays: {options}"
    test-on: "Previewing {holiday} for everyone. /miniz festive test off to stop."
    list-header: "Holidays (next date):"
    none-today: "No holiday today."
    today: "It's {holiday}!"
    yours-on: "Your festive looks are on (/miniz festive on|off)."
    yours-off: "Your festive looks are off (/miniz festive on|off)."
    usage: "Usage: /miniz festive on|off"
    "on": "Your Mini Me will dress up for holidays."
    "off": "No more holiday looks."
  upgrade:
    usage: "Usage: /miniz upgrade health"
  aggro:
    usage: "Usage: /miniz aggro on|off"
    "on": "Mobs can attack your Mini Me now (it fights back). Give it armor in /miniz gear!"
    "off": "Mobs will leave your Mini Me alone."
  mine:
    list-empty: "It isn't set to mine anything."
    list: "Mining: {list}"
    ores: "It'll mine every ore."
    none: "It won't mine anything."
    unknown: "Unknown thing to mine. Try: {options}"
