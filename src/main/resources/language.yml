    nametag:
      name: "Show name"
    mode:
      name: "Mode"
    pose:
      name: "Resting pose"
    trail:
      name: "Trail"
    glow:
      "off": "Off"
      name: "Glow: {color}"
      lore: "Left-click: next color\nRight-click: previous color"
    mimic:
      name: "Copy me"
